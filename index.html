;font-size:clamp(17px,2.2vw,25px);cursor:pointer;box-shadow:0 5px 10px #492b2366}button:hover{filter:brightness(1.1)}button:focus-visible{outline:4px solid #1765c1;outline-offset:4px}#again{background:linear-gradient(#30844c,#155b34);outline-color:#155b34}.note{font-family:Arial,sans-serif;font-size:14px;color:#58634f;margin:20px 0 0}@media(max-width:620px){body{padding:10px}.hero{display:flex;flex-direction:column}.elf{min-height:260px;background-position:center 39%}.message{border-left:0;border-top:5px solid #d6a66e;padding:22px}.message h1{margin-bottom:16px}.message p+p{margin-top:12px}.panel{padding:15px}.actions{flex-direction:column}button{width:100%}}@media(prefers-reduced-motion:reduce){button{transition:none}}
</style></head><body><main class="wrap"><section class="hero" aria-label="A manók üzenete"><div class="elf" role="img" aria-label="Mosolygós karácsonyi manó egy lámpás mellett"></div><div class="message"><h1>A manók titkos küldetése</h1><p>Ma egy különleges feladatot kaptál a Mikulás manóitól!</p><p>Tegyél valami kedveset valakivel, és tedd egy kicsit szebbé a napját!</p></div></section><section class="panel" aria-label="Küldetéssorsoló"><div class="mission" id="mission" aria-live="polite">Kattints a piros gombra, és megkapod a titkos küldetésed!</div><div class="actions"><button id="go">Kérem a titkos küldetésemet!</button><button id="again">Másik küldetést kérek!</button></div><p class="note">A küldetést nem kell igazolnod. A kedvesség önmagában ajándék.</p></section></main><script>const tasks=["Dicsérj meg ma valakit őszintén!", "Segíts egy osztálytársadnak valamiben!", "Köszönd meg valakinek a segítségét!", "Készíts kedves üzenetet valakinek!", "Hívd játszani azt, aki egyedül van!", "Segíts rendet rakni kérés nélkül!", "Mondj valakinek egy bátorító mondatot!", "Köszönj kedvesen valakinek, akivel ritkán beszélsz!", "Ajánld fel a segítségedet otthon!", "Köszönd meg egy iskolai dolgozó munkáját!", "Hallgass meg figyelmesen valakit!", "Engedj előre valakit a sorban!", "Dicsérd meg valakinek az igyekezetét!", "Írj egy rövid köszönőlevelet!", "Segíts egy fiatalabb diáknak!", "Mosolyogj rá valakire, akinek nehéz napja van!", "Oszd meg valakivel egy jó ötletedet!", "Vigyázz ma különösen a közös környezetetekre!", "Kérdezd meg valakitől, hogy van, és figyelj a válaszára!", "Készíts rajzot valakinek ajándékba!", "Kívánj szép napot három embernek!", "Bátoríts valakit, aki valami újat próbál!", "Tegyél egy apró szívességet titokban!", "Mondj el valakinek egy kedves emléket róla!"];let previous=-1;function pick(){let n=Math.floor(Math.random()*(tasks.length-1));if(previous>=0&&n>=previous)n++;previous=n;document.getElementById('mission').textContent=tasks[n]}document.getElementById('go').addEventListener('click',pick);document.getElementById('again').addEventListener('click',pick);</script></body></html>
